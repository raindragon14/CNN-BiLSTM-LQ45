# Source: IDX LQ45 Company Profiles, August 2019 - January 2020 period
# (the 45 official constituents listed on the "Contents" page).
#   Original document : https://www.idx.co.id/media/7599/lq45-company-profiles-august-2019.pdf
#   Archive           : https://web.archive.org/web/20210614191119/https://www.idx.co.id/media/7599/lq45-company-profiles-august-2019.pdf
#
# Selection rationale:
# - The composition in force at the start of the out-of-sample period (January
#   2020) is used rather than the current composition, so that no future
#   information is introduced and no survivorship bias arises from the
#   end-of-period list.
# - The pool is frozen (fixed) for the entire study period; this limitation is
#   recorded in data/README.md.
