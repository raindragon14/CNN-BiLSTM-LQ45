# Jejak keputusan: docs/keputusan_desain.md

device: auto  # "auto" -> CUDA bila tersedia, jika tidak CPU

lookback_days: 60   # w: keputusan mandiri, diuji sensitivitas jendela
horizon_days: 5     # tau: keputusan mandiri, diuji sensitivitas jendela

cnn:
  filters: [32, 64]    # Espiga-Fernandez et al. (2024) Tabel 3
  kernel_size: 3       # Chaweewanchon & Chaysiri (2022)
  activation: relu     # Espiga-Fernandez et al. (2024) Tabel 3
  batchnorm: true      # Chaweewanchon & Chaysiri (2022)
  pooling:
    size: 2            # keputusan mandiri (artikel tidak mematok angka)

bilstm:
  units: 64            # disetel pada periode desain
  layers: 2            # Graves, Mohamed & Hinton (2013); Chaweewanchon & Chaysiri (2022); Sebastian & Tantia (2024)
  bidirectional: true

dropout:
  cnn: 0.2   # Sebastian & Tantia (2024); disetel pada periode desain
  lstm: 0.2  # Sebastian & Tantia (2024); disetel pada periode desain
  dense: 0.2 # Sebastian & Tantia (2024); disetel pada periode desain

optimizer:
  name: adam
  lr: 0.0001       # Chaweewanchon & Chaysiri (2022) Bagian 4.1.3
  weight_decay: 0.0  # disetel pada periode desain (0 vs 1e-4)

loss:
  name: mse  # Chaweewanchon & Chaysiri (2022); Kim et al. (2025)

epochs: 100      # Chaweewanchon & Chaysiri (2022); Sebastian & Tantia (2024)

early_stopping:
  patience: 8    # Sebastian & Tantia (2024)
  monitor: validation_loss

batch_size: 32   # default sebelum tuning; best_hyperparams.yaml overrides (batch 64)

seeds: [0, 1, 2, 3, 4]  # Reimers & Gurevych (2017); Bouthillier et al. (2021)

tuning:
  train: "2018-01-01/2018-12-31"
  validate: "2019-01-01/2019-12-31"
  selection_metric: validation_loss
  grid:
    bilstm.units: [32, 64, 128]
    batch_size: [32, 64]
    optimizer.weight_decay: [0.0, 0.0001]
    pooling.size: [2, 3]

sensitivity:
  lookback_days: [30, 60, 120]
  horizon_days: [1, 5, 21]

# Masked Autoencoder Pre-training (self-supervised)
# Referensi: PatchTST (Nie et al. 2022), TimeMAE (Cheng et al. 2023), MTSMAE (Tang & Zhang 2022)
# Kang (2025): LSTM on raw OHLCV >= technical indicators untuk prediksi harga
pretrain:
  enabled: true
  method: "mae"
  input_channels: 7          # OHLCV + BI-7DRRR + JISDOR (Kang 2025 + makro eksogen)
  mask_ratio: 0.3            # standar MAE (He et al. 2022)
  epochs: 50
  lr: 0.001
  weight_decay: 0.0
  batch_size: 64
  patience: 10
  val_ratio: 0.1             # 10% untuk validasi reconstruction
  decoder:
    hidden: 128
    layers: 2
  fine_tune:
    freeze_encoder: false    # full fine-tune dengan discriminative LR
    head_lr: 0.0001          # projection head LR
    encoder_lr: 0.00001      # encoder LR (10x lebih kecil)