# Nested walk-forward: validation out-of-sample tepat sebelum test.
# Train awal 2 tahun (2018-2019) -> TEST mulai Jan 2020 (mencakup COVID).
initial_train_years: 2
validation_days: 63              # ~3 bulan, early stopping + seleksi
test_days: 21                    # 1 bulan, evaluasi akhir
step_days: 21                    # geser tiap bulan
expanding: true

purge:
  horizon_days: 5                # tau: buang label train yang jatuh di validation
embargo_days: 59                 # w-1

design_period: ["2018-01-01", "2019-12-31"]   # untuk freeze arsitektur/hyperparameter
freeze_hyperparameters: true
