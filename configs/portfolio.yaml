selection:
  k_values: [5, 7, 10]           # grid utama RQ2
  k_sensitivity: [3, 15, 20]     # perluasan kurva Sharpe vs k

covariance:
  lookback_days: 120
  lookback_sensitivity: [60, 252]
  estimators: [sample, ridge_epsilon, ledoit_wolf, gmv]
  ridge_epsilon: 0.0001

constraints:
  long_only: true
  sum_to_one: true
  max_weight: 0.35               # keputusan mandiri; diuji sensitivitas
  max_weight_sensitivity: [0.25, 0.50, 1.0]
  turnover_penalty: 0.0

optimization:
  types: ["target_return"]
  target_return_method: "mean_pred_ens"

rebalance_days: 21
